services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      F1_DATA_DIR: /data
      F1_LIVE_ENABLED: ${F1_LIVE_ENABLED:-true}
      F1_SCHEDULER_ENABLED: ${F1_SCHEDULER_ENABLED:-true}
      F1_SCHEDULER_POLL_SECONDS: ${F1_SCHEDULER_POLL_SECONDS:-30}
      F1_SCHEDULER_LEAD_SECONDS: ${F1_SCHEDULER_LEAD_SECONDS:-300}
      F1_SCHEDULER_MAX_SESSION_SECONDS: ${F1_SCHEDULER_MAX_SESSION_SECONDS:-21600}
    volumes:
      - f1_livetiming_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard/f1-dashboard
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${F1_DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  f1_livetiming_data: